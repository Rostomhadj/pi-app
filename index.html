<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsPi Business Premium</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; margin: 0; background-color: #f0f2f5; color: #111b21; }
        
        /* WhatsApp Style Header */
        .header { background-color: #008069; color: white; padding: 15px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1000; }
        .header h1 { margin: 0; font-size: 20px; font-weight: 500; }
        
        /* Search Bar */
        .search-container { background-color: white; padding: 10px; margin: 10px; border-radius: 20px; display: flex; align-items: center; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .search-container input { border: none; outline: none; width: 100%; margin-left: 10px; font-size: 15px; color: #667781; }
        
        /* Promotion Banner */
        .banner { background-color: #fff3cd; color: #856404; padding: 12px; margin: 10px; border-radius: 10px; font-size: 13px; display: flex; align-items: center; border: 1px solid #ffeeba; }
        .banner i { margin-right: 10px; font-size: 16px; }

        /* Services List */
        .list-container { padding: 5px 10px; }
        .list-item { background-color: white; margin-bottom: 8px; padding: 14px; border-radius: 12px; display: flex; align-items: center; cursor: pointer; transition: 0.2s; border-bottom: 1px solid #f0f2f5; }
        .list-item:active { background-color: #f5f6f6; transform: scale(0.98); }
        
        .icon-circle { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; color: white; flex-shrink: 0; }
        
        .content { flex: 1; margin-left: 15px; }
        .content h3 { margin: 0; font-size: 16px; font-weight: 600; display: flex; align-items: center; }
        .content p { margin: 4px 0 0 0; font-size: 13px; color: #667781; line-height: 1.3; }
        
        .status-badge { background-color: #a063cf; color: white; padding: 2px 8px; border-radius: 10px; font-size: 10px; margin-left: 8px; text-transform: uppercase; }
        .offer-tag { font-size: 11px; color: #00a884; font-weight: 600; margin-top: 5px; }
    </style>
</head>
<body>

<div class="header">
    <div style="display: flex; align-items: center;">
        <i class="fas fa-bars" style="margin-right: 20px; cursor: pointer;"></i>
        <h1>WhatsPi Business</h1>
    </div>
    <div>
        <i class="fas fa-camera" style="margin-right: 20px; cursor: pointer;"></i>
        <i class="fas fa-ellipsis-v" style="cursor: pointer;"></i>
    </div>
</div>

<div class="search-container">
    <i class="fas fa-search" style="color: #667781;"></i>
    <input type="text" placeholder="Ask Meta AI or Search...">
</div>

<div class="banner">
    <i class="fas fa-bullhorn"></i>
    <span><b>Special Launch Offer:</b> All premium features are 100% FREE for 6 Months!</span>
</div>

<div class="list-container">
    <div class="list-item" onclick="activateService('AI Business Consultant')">
        <div class="icon-circle" style="background-color: #34b7f1;">
            <i class="fas fa-robot"></i>
        </div>
        <div class="content">
            <h3>AI Accounting & Consultant <span class="status-badge">Online</span></h3>
            <p>Solve auditing, accounting, and production issues instantly with AI.</p>
            <div class="offer-tag">2 Months Free Trial Included</div>
        </div>
    </div>
